[project]
name = "agentchaos-example-external"
version = "0.0.1"
description = "Installable developer-owned adapter example for AgentChaos"
requires-python = ">=3.12"
dependencies = ["agentchaos[openai]>=0.0.1"]

[tool.uv.sources]
agentchaos = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
