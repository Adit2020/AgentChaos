[project]
name = "agentchaos"
version = "0.0.1"
description = "Trace-driven reliability testing for AI agents with controlled tool faults"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
openai = ["openai-agents>=0.23.1"]

[dependency-groups]
dev = [
    "openai-agents>=0.23.1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "rich>=13,<15",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
