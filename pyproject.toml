[project]
name = "agentchaos"
version = "0.0.1"
description = "Trace-driven reliability testing for AI agents with controlled tool faults"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "rich>=13,<15"]

[project.scripts]
agentchaos = "agentchaos.cli:app"

[project.optional-dependencies]
openai = ["openai-agents>=0.23.1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = [
    "agentchaos-example-external",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai-agents>=0.23.1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "uvicorn>=0.30,<1",
]

[tool.uv.sources]
agentchaos-example-external = { workspace = true }

[tool.uv.workspace]
members = ["examples/external_integration"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
